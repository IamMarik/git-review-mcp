startCommand:
  type: stdio
  configSchema:
    type: object
    required: ['REVIEW_BASE_DIR']
    properties:
      REVIEW_BASE_DIR:
        type: string
        description: 'Required absolute directory containing all reviewable local repositories.'
      MCP_LOG_LEVEL:
        type: string
        default: 'info'
        description: 'Minimum structured log level.'
  commandFunction: |
    (config) => ({
      "command": "bunx",
      "args": ["@iammarik/repo-review-mcp@latest"],
      "env": {
        "MCP_TRANSPORT_TYPE": "stdio",
        "MCP_LOG_LEVEL": config.MCP_LOG_LEVEL,
        "REVIEW_BASE_DIR": config.REVIEW_BASE_DIR
      }
    })
